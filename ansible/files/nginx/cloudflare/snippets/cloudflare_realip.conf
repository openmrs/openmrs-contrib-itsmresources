# Cloudflare origin-pull real-IP recovery.
#
# When a vhost is proxied through Cloudflare (orange cloud), nginx sees a Cloudflare edge IP
# as the connection peer. These directives restore the true visitor IP into $remote_addr, and
# therefore into the access logs, X-Real-IP, and X-Forwarded-For sent to the backends.
#
# set_real_ip_from is the trust gate: the CF-Connecting-IP header is only honored when the
# connection actually originates from one of these Cloudflare ranges, so a client connecting
# directly to the origin cannot spoof it. Non-proxied (grey-cloud) vhosts on the same host are
# unaffected -- their peer is not in these ranges, so $remote_addr keeps the real client IP.
#
# Source: https://www.cloudflare.com/ips/ (api.cloudflare.com/client/v4/ips),
#   etag 38f79d050aa027e3be3865e495dcc9bc, fetched 2026-06-17. The ranges below are pinned, so
#   cloudflare_ips_check.py alerts when this etag changes; on change, refresh both the ranges
#   here and cloudflare_ips_expected_etag in group_vars/cloudflare/vars in the same commit.

# IPv4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
