---
  - name: Copy datadog check
    copy:
      owner: dd-agent
      group: dd-agent
      mode: 0755
      src: files/monitoring/checks/upgrades_check.py
      dest: /etc/datadog-agent/checks.d/
    notify: restart datadog-agent

  - name: Copy Cloudflare IP-list change-detection check
    copy:
      owner: dd-agent
      group: dd-agent
      mode: 0755
      src: files/monitoring/checks/cloudflare_ips_check.py
      dest: /etc/datadog-agent/checks.d/
    when: "'cloudflare' in group_names"
    notify: restart datadog-agent

  - name: Configure Cloudflare IP-list change-detection check
    copy:
      owner: dd-agent
      group: dd-agent
      mode: 0644
      dest: /etc/datadog-agent/conf.d/cloudflare_ips_check.yaml
      content: |
        init_config:

        instances:
          - expected_etag: "{{ cloudflare_ips_expected_etag }}"
            min_collection_interval: 86400
    when: "'cloudflare' in group_names"
    notify: restart datadog-agent

  - name: Ensure obsolete docker_daemon conf files are absent
    file:
      state: absent
      path: /etc/datadog-agent/conf.d/docker_daemon.yml

  - name: Ensure obsolete docker_daemon check files are absent
    file:
      state: absent
      path: /etc/datadog-agent/checks.d/docker_daemon.py

  - name: Remove datadog checks from Ver5 directory
    file:
      state: absent
      path: /opt/datadog-agent/agent/checks.d

  - name: Check Datadog-Agent embedded pip is usable
    command: /opt/datadog-agent/embedded/bin/python3 -c "import pip._internal.resolution.resolvelib.resolver"
    register: datadog_embedded_pip_check
    changed_when: false
    failed_when: false

  - name: Repair Datadog-Agent embedded pip
    when: datadog_embedded_pip_check.rc != 0
    block:
      - name: Locate Datadog-Agent embedded site-packages
        command: /opt/datadog-agent/embedded/bin/python3 -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
        register: datadog_embedded_site_packages
        changed_when: false

      - name: Find Datadog-Agent embedded pip installs
        find:
          paths: "{{ datadog_embedded_site_packages.stdout }}"
          patterns:
            - pip
            - pip-*.dist-info
          file_type: directory
        register: datadog_embedded_pip_dirs

      - name: Remove Datadog-Agent embedded pip installs
        file:
          path: "{{ item.path }}"
          state: absent
        loop: "{{ datadog_embedded_pip_dirs.files }}"

      - name: Reinstall datadog-agent to restore its bundled pip
        command: apt-get install --reinstall -y datadog-agent
        notify: restart datadog-agent

  - name: Install Python modules for custom dd-checks
    pip:
      executable: /opt/datadog-agent/embedded/bin/pip
      name:
        - checks
        - utils

  - name: Upgrade Python OpenSSL Module for SSL Expiry Check
    pip:
      executable: /opt/datadog-agent/embedded/bin/pip
      name: pyopenssl
      state: latest


  ## Adding some versions as dynamic tags for datadog
  - name: Copy datadog prep-environment script for service
    copy:
      owner: dd-agent
      group: dd-agent
      mode: 0755
      src: files/monitoring/prep-environment.sh
      dest: /etc/datadog-agent/
    notify: restart datadog-agent

  - name: Create empty datadog environment file
    copy:
      owner: dd-agent
      group: dd-agent
      mode: 0644
      src: files/monitoring/environment
      dest: /etc/datadog-agent/
      force: false
    notify: restart datadog-agent

  - name: Add ExecStartPre to datadog service
    ansible.builtin.lineinfile:
      path: /lib/systemd/system/datadog-agent.service
      regexp: '^ExecStartPre=.*'
      insertbefore: '^ExecStart=.*'
      line: 'ExecStartPre=/etc/datadog-agent/prep-environment.sh'

  - name: Reload datadog service
    command: systemctl daemon-reload