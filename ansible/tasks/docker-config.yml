---
  - name: Configure the docker daemon
    template:
      owner: root
      group: root
      mode: 0644
      src: templates/docker/docker_daemon.json.j2
      dest: /etc/docker/daemon.json
    register: docker_daemon_config

  # daemon.json is read only at daemon start, so a config change needs a stop/start rather
  # than a reload. docker.socket is stopped alongside the service because socket activation
  # would otherwise restart the daemon against the old config before the start step runs.
  - name: Restart docker to pick up the daemon configuration
    when: docker_daemon_config is changed
    block:
      - name: Stop docker service
        ansible.builtin.systemd:
          name: docker.service
          state: stopped

      - name: Stop docker socket
        ansible.builtin.systemd:
          name: docker.socket
          state: stopped

      - name: Start docker socket
        ansible.builtin.systemd:
          name: docker.socket
          state: started
          daemon_reload: true

      - name: Start docker service
        ansible.builtin.systemd:
          name: docker.service
          state: started

  - name: Adding dd-agent to docker group
    user: name='dd-agent'
        groups='docker'
        append=yes

  - name: Configure datadog service to start after docker
    lineinfile:
       dest: /lib/systemd/system/datadog-agent.service
       regexp: '^After='
       line: "After=network.target docker.service"
       state: present
    notify: restart datadog-agent

  - name: Docker cleanup script copy
    copy:
      src: 'files/docker-cleanup.sh'
      dest: "/usr/sbin/docker-cleanup.sh"
      owner: 'root'
      group: 'root'
      mode: '0700'

  - name: Docker cleanup cron
    cron:
      name: "docker-cleanup"
      minute: "0"
      hour: "2"
      job: "/usr/sbin/docker-cleanup.sh"

  - name: Setup docker for ElasticSearch
    sysctl: name={{ item.key }} value={{ item.value }}
    with_items:
      - { key: "vm.max_map_count", value: "262144" }
