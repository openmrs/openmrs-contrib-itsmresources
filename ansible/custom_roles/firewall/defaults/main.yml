---
# Master switch: the role is a no-op unless a host opts in (e.g. in host_vars).
firewall_enabled: false

# When true, inbound 80/443 is opened; otherwise the host is SSH-only.
firewall_allow_http: "{{ restrict_http_to_cloudflare }}"

# When true, inbound 80/443 is limited to cloudflare_ip_ranges instead of any source.
restrict_http_to_cloudflare: false
